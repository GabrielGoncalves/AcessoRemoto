name: Build Remote Craft

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flet
          # Se tiver um arquivo de requisitos, descomente a linha abaixo:
          # pip install -r requirements.txt 

      # ==========================================
      # BUILD PARA MAC E LINUX (ZIP PADRÃO)
      # ==========================================
      - name: 🏗️ Compilar o app (macOS e Linux)
        if: matrix.os != 'windows-latest'
        run: flet pack app.py --name "RemoteCraft-${{ runner.os }}"

      - name: 🗜️ Zipar os arquivos (macOS e Linux)
        if: matrix.os != 'windows-latest'
        run: zip -r RemoteCraft-${{ runner.os }}.zip dist/

      # ==========================================
      # BUILD PARA WINDOWS (USANDO INNO SETUP)
      # ==========================================
      - name: 🏗️ Compilar o app (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          flet pack app.py --name "AcessoRemoto"
          mkdir -p build\windows
          move dist\AcessoRemoto.exe build\windows\

      - name: 📦 Criar Instalador Windows (Inno Setup)
        if: matrix.os == 'windows-latest'
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          iscc /DMyAppVersion=$VERSION setup.iss

      # ==========================================
      # UPLOAD PARA A RELEASE NO GITHUB
      # ==========================================
      - name: 🚀 Fazer Upload para a Release Oficial
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RemoteCraft-*.zip
            build/windows_installer/Instalador_RemoteCraft.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}