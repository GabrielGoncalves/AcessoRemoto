name: Build Remote Craft

on:
  push:
    branches: [ "v2" ]
  workflow_dispatch:

jobs:
  build:
    name: Build para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 

      - name: Determinar arquivo de dependências (Smart Selector)
        id: set-reqs
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "REQ_FILE=requirements-win.txt" >> $GITHUB_ENV
          elif [ "$RUNNER_OS" == "macOS" ]; then
            echo "REQ_FILE=requirements-mac.txt" >> $GITHUB_ENV
          else
            # Para Linux, usamos o arquivo .in cru para ele resolver na hora
            echo "REQ_FILE=requirements.in" >> $GITHUB_ENV 
          fi

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.REQ_FILE }}

      - name: Compilar no Windows
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: utf-8
        run: echo y | flet build windows --module-name app

      - name: Compilar no macOS
        if: runner.os == 'macOS'
        run: yes | flet build macos --module-name app

      - name: Compilar no Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          yes | flet build linux --module-name app

      - name: Disponibilizar o Executável para Download
        uses: actions/upload-artifact@v4
        with:
          name: RemoteCraft-${{ runner.os }}
          path: build/${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}