name: Build RemoteDesk

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determinar arquivo de dependências
        id: set-reqs
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "REQ_FILE=requirements-win.txt" >> $GITHUB_ENV
          elif [ "$RUNNER_OS" == "macOS" ]; then
            echo "REQ_FILE=requirements-mac.txt" >> $GITHUB_ENV
          else
            echo "REQ_FILE=requirements.in" >> $GITHUB_ENV 
          fi

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.REQ_FILE }}

      - name: Compilar no Windows
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: utf-8
        run: echo y | flet build windows 

      - name: Gerar Instalador Windows (Inno Setup)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ github.ref_name }}" setup.iss

      - name: Compilar no macOS
        if: runner.os == 'macOS'
        run: yes | flet build macos 

      - name: Compilar no Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-dev pkg-config ninja-build mesa-utils
          yes | flet build linux 

      - name: Disponibilizar Artefato Interno
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-${{ runner.os }}
          path: |
            ${{ runner.os == 'macOS' && 'build/macos' || runner.os == 'Windows' && 'build/windows_installer/Instalador_RemoteDesk.exe' || 'build/linux' }}
          retention-days: 1

  release:
    name: Criar Página de Download
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar todos os executáveis da nuvem
        uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Compactar em ZIP para download (Apenas Mac e Linux)
        run: |
          cd artefatos
          zip -r RemoteDesk-macOS.zip RemoteDesk-macOS/
          zip -r RemoteDesk-Linux.zip RemoteDesk-Linux/

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "RemoteDesk ${{ github.ref_name }}"
          body: "Faça o download dos executáveis do RemoteDesk para a versão **${{ github.ref_name }}** abaixo.\n\nPara Windows, baixe o **Instalador_RemoteDesk.exe**."
          files: |
            artefatos/*.zip
            artefatos/RemoteDesk-Windows/Instalador_RemoteDesk.exe